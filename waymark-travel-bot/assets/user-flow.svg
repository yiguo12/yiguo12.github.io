<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2850"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#087e50"/></marker></defs><rect x="0" y="0" width="2400" height="2850" rx="0" fill="#f5f8f3"/><text x="70" y="75.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#087e50">WAYMARK / USER FLOW / 2026.10.24</text><text x="70" y="145.0" font-family="Noto Sans CJK TC" font-size="48" font-weight="700" fill="#172d25">依你的 Flow Chart 修訂</text><text x="70" y="205.0" font-family="Noto Sans CJK TC" font-size="25" font-weight="400" fill="#75857c">保留原群組／新群組、同意／不同意、讀取範圍、滿意／修改、停止／繼續與結果回饋。</text><rect x="770" y="260" width="860" height="120" rx="18" fill="white" stroke="#cddbd0"/><text x="792" y="300.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">建立旅遊 → 尋找成員</text><text x="792" y="339.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">先判斷是否已有討論群組</text><rect x="120" y="440" width="660" height="125" rx="18" fill="white" stroke="#cddbd0"/><text x="142" y="480.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">有 → 使用原本群組</text><text x="142" y="519.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">00E｜接續原群組的討論</text><rect x="1620" y="440" width="660" height="125" rx="18" fill="white" stroke="#cddbd0"/><text x="1642" y="480.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">沒有 → 建立新群組</text><text x="1642" y="519.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">00N｜找齊成員，開始討論</text><path d="M1200 380 V410 H450 V424" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1200 410 H1950 V424" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="615" width="860" height="130" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="792" y="655.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">呼叫 Bot → 是否同意啟用？</text><text x="792" y="694.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">01 → 01C｜尚未擷取對話</text><path d="M450 565 V680 H754" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1950 565 V680 H1646" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1780" y="790" width="500" height="120" rx="18" fill="white" stroke="#cddbd0"/><text x="1802" y="830.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">不同意 → 停止啟用</text><text x="1802" y="869.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">01X｜不擷取對話</text><path d="M1630 710 H2030 V774" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1710" y="700.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">否</text><rect x="770" y="810" width="860" height="120" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="792" y="850.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">同意 → 選擇讀取範圍</text><text x="792" y="889.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">02｜選好後才開始擷取</text><path d="M1200 745 V794" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1220" y="782.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">是</text><rect x="120" y="1000" width="660" height="130" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="142" y="1040.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">從現在開始擷取</text><text x="142" y="1079.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">03A｜只整理起點之後的新訊息</text><rect x="1620" y="1000" width="660" height="130" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="1642" y="1040.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">讀取全部可取得的對話</text><text x="1642" y="1079.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">03B｜已提供的歷史＋後續新訊息</text><path d="M1200 930 V960 H450 V984" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1200 960 H1950 V984" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="1180" width="860" height="140" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="792" y="1220.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">自然聊天 → Bot 辨識與彙整</text><text x="792" y="1259.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">04A/B → 05A/B｜景點、連結、來源、全員需求與偏好</text><path d="M450 1130 V1250 H754" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1950 1130 V1250 H1646" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="1390" width="860" height="140" rx="18" fill="white" stroke="#cddbd0"/><text x="792" y="1430.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">查看建議 → 浮動視窗與來源</text><text x="792" y="1469.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">06 → 08 → SRC｜有其他建議／備案可瀏覽</text><path d="M1200 1320 V1374" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="1600" width="860" height="130" rx="18" fill="white" stroke="#cddbd0"/><text x="792" y="1640.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">是否滿意規劃結果？</text><text x="792" y="1679.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">09｜滿意才放入行程</text><path d="M1200 1530 V1584" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="120" y="1600" width="520" height="150" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="142" y="1640.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">不滿意 → 補充條件</text><text x="142" y="1679.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">EDIT → REV</text><text x="142" y="1706.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">重新產生建議，再判斷是否滿意</text><path d="M770 1665 H656" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="690" y="1643.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">否</text><path d="M380 1600 V1455 H754" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="1800" width="860" height="130" rx="18" fill="white" stroke="#cddbd0"/><text x="792" y="1840.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">滿意 → 放入行程</text><text x="792" y="1879.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">10 / 10R｜接著判斷是否停止擷取</text><path d="M1200 1730 V1784" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1220" y="1774.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">是</text><rect x="1780" y="1780" width="500" height="160" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="1802" y="1820.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">不停止 → 繼續擷取</text><text x="1802" y="1859.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">CONT｜保留目前版本</text><text x="1802" y="1886.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">接續討論、再彙整需求</text><path d="M1630 1865 H1764" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1680" y="1838.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">否</text><path d="M2030 1780 V1250 H1646" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="2000" width="860" height="135" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="792" y="2040.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">停止 → 使用者確認完成</text><text x="792" y="2079.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">11 → 12｜保存版本，顯示擷取已停止</text><path d="M1200 1930 V1984" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="1220" y="1976.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="700" fill="#087e50">是</text><rect x="770" y="2205" width="860" height="140" rx="18" fill="#ecf9e9" stroke="#cddbd0"/><text x="792" y="2245.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">輸出結果與收集回饋</text><text x="792" y="2284.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">13｜個人行事曆示範／剛剛好／太多／太少</text><path d="M1200 2135 V2189" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="770" y="2420" width="860" height="130" rx="18" fill="white" stroke="#cddbd0"/><text x="792" y="2460.0" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#172d25">正式完成規劃，可隨時查看</text><text x="792" y="2499.0" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#75857c">SAVED｜查看已存行程不會恢復擷取</text><path d="M1200 2345 V2404" stroke="#087e50" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="70" y="2660.0" font-family="Noto Sans CJK TC" font-size="25" font-weight="700" fill="#087e50">操作原則：收起浮動視窗只是回到群組；明確確認完成，才保存並停止擷取。</text><text x="70" y="2720.0" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#75857c">A、B 路徑各自保留資料範圍；原版與修改版各自保存。不滿意與繼續擷取都有回到前一步的路徑。</text><text x="70" y="2780.0" font-family="Noto Sans CJK TC" font-size="20" font-weight="400" fill="#75857c">依使用者提供的 image.png 整理。少數模糊小字以節點功能撰寫；所有資料、AI 回覆與日曆操作皆為示範。</text></svg>