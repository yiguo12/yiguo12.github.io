<aside class="sidebar"><div class="brand"><div class="brandmark" data-icon="Compass"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></div>Waymark</div><div><div class="side-label">我的群組</div><button class="groupitem" data-action="group"><div class="groupmini" data-icon="MessageCircle"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg></div><div><strong>大阪吃走小隊</strong><p>一起收藏，一起出發。</p></div></button></div><div class="side-note">旅途，從聊天開始。<br>把朋友分享的靈感，慢慢排成一趟旅行。</div><div class="me-account"><div class="avatar mia">M</div><div class="userinfo">Mia<small>我的帳號</small></div></div></aside>
<main class="workspace" id="workspace"><header class="topbar"><div class="groupavatar" data-icon="Users"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></div><div class="titleblock"><h1>大阪吃走小隊</h1><div class="subhead">Alex、Mia、Ben、Yuki</div></div><div class="tools"><button class="bot-badge" id="botbadge" data-action="botmenu" aria-label="Waymark 狀態與設定"><span class="dot"></span><span id="botstatus">Waymark</span></button><button class="iconbtn" aria-label="搜尋群組訊息" data-action="search" data-icon="Search"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button><button class="iconbtn member-tool" aria-label="查看群組成員" data-action="members" data-icon="Users"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/></svg></button><button class="iconbtn" aria-label="更多群組選項" data-action="more" data-icon="MoreHorizontal"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button></div></header>

function renderDrawer(){if(!drawer)return;const day=editPlan.days[selectedDay],p=editPlan;$('drawerroot').innerHTML=`<div class="drawer-backdrop" data-action="close-drawer"></div><section class="drawer" role="region" aria-label="大阪旅行行程"><header class="drawer-head"><div><div class="eyebrow">OSAKA / 3 DAYS</div><h2>大阪，三天剛剛好。</h2><div class="drawer-sub">11/20 – 11/22<span>·</span>4 人<span>·</span>v${state.plan.version}${dirty?' · 有新調整':''}</div></div><button class="iconbtn" data-action="close-drawer" aria-label="收起行程視窗">${icon('X')}</button></header><nav class="drawer-tabs"><button class="${drawerTab==='plan'?'selected':''}" data-action="tab" data-value="plan">行程</button><button class="${drawerTab==='candidates'?'selected':''}" data-action="tab" data-value="candidates">候選清單</button></nav><div class="drawer-content">${drawerTab==='plan'?`<div class="daytabs">${p.days.map((d,i)=>`<button class="${i===selectedDay?'selected':''}" data-action="day" data-day="${i}">第 ${i+1} 天<small>${d.date}</small></button>`).join('')}</div><div class="sectiontitle">${esc(day.title)}<span>${day.items.length} 個安排</span></div>${day.items.length?day.items.map((it,i)=>`<div class="stop" draggable="true" data-stop="${i}"><div class="stop-number">${i+1}</div><div class="stop-main"><strong>${esc(place(it.place).name)}</strong><div class="stop-detail"><input type="time" value="${esc(it.time)}" aria-label="${esc(place(it.place).name)}的時間" data-time="${i}"><button class="source-link" style="margin:0" data-action="source" data-place="${esc(it.place)}">${icon('Link')}來源</button></div></div><div class="stop-side"><button class="iconbtn small" data-action="move-stop" data-index="${i}" data-direction="-1" aria-label="${esc(place(it.place).name)}往前移" ${i===0?'disabled':''}>${icon('ArrowUp')}</button><button class="iconbtn small" data-action="remove-stop" data-index="${i}" aria-label="將${esc(place(it.place).name)}移回候選">${icon('X')}</button></div></div>`).join(''):`<div class="empty">這天還沒安排，<br>從候選清單選幾個想去的地方 function propose(text){if(!state.plan)return null;const p=clone(state.plan),changes=[];let d=/第三|第3|day\s*3/i.test(text)?2:/第二|第2/.test(text)?1:/第一|第1/.test(text)?0:2;

 if(a==='call')callBot();else if(a==='close-modal'||a==='dismiss-modal')closeModal();else if(a==='open-trip')openTrip();else if(a==='candidates')openTrip('candidates');else if(a==='close-drawer')closeDrawer();else if(a==='botmenu'||a==='members'||a==='more')openPopover(a);else if(a==='search')toggleSearch();else if(a==='group'){closePopover();closeModal();if(drawer)closeDrawer()}else if(a==='attach')attachModal();else if(a==='manual-place')manualPlaceModal();else if(a==='source')sourceModal(b.dataset.place);else if(a==='jump-source'){const id=b.dataset.ref;closeModal();if(!dirty){drawer=null;$('drawerroot').innerHTML=''}const el=$(id);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),2600)}else toast('這則來源已保留在地點資訊裡。')}else if(a==='tab'){drawerTab=b.dataset.value;renderDrawer()}else if(a==='day'){selectedDay=Number(b.dataset.day);renderDrawer()}else if(a==='add-stop')addStop(b.dataset.place);else if(a==='remove-stop'){editPlan.days[selectedDay].items.splice(Number(b.dataset.index),1);editChanged()}else if(a==='move-stop'){const i=Number(b.dataset.index),j=i+Number(b.dataset.direction),items=editPlan.days[selectedDay].items;if(j>=0&&j<items.length){[items[i],items[j]]=[items[j],items[i]];editChanged()}}else if(a==='save-edit'){commitPlan(clone(editPlan),'已把你在行程裡的調整分享到群組。大家可以接著看這一版。');toast('修改已分享回群組。')}else if(a==='keep-edit'){closeModal();drawer=null;$('drawerroot').innerHTML='';toast('修改先保留，重新打開還能繼續。');drawer=null}else if(a==='discard-edit'){closeModal();dirty=false;drawer=null;$('drawerroot').innerHTML=''}else if(a==='confirm')confirmPlan();else if(a==='accept-proposal'){if(!state.proposal||state.proposal.base!==state.plan.version){toast('行程已有更新，請重新提出修改。');return}const m=state.messages.find(x=>x.proposalId===state.proposal.id);if(m)m.outcome='已套用到新版本';const p=clone(state.proposal.plan);state.proposal=null;commitPlan(p,'已更新這次的調整，其他安排都有保留。')}else if(a==='reject-proposal'){const m=state.messages.find(x=>x.proposalId===state.proposal?.id);if(m)m.outcome='未套用，保留原本安排';state.proposal=null;save();renderMessages();toast('保留原本的安排。')}else if(a==='finish')finishModal();else if(a==='finish-now')stop();else if(a==='calendar'){closePopover();downloadCalendar()}else if(a==='feedback'){state.feedback=b.dataset.value;save();renderMessages();if(state.feedback==='bad')showModal(`${modalHead('下次想怎麼調整？')}<p>你的回饋會和這次規劃一起保留。</p><div class="modal-footer" style="flex-direction:column"><button class="btn" data-action="feedback-detail" data-value="太滿">景點太多、太趕</button><button class="btn" data-action="feedback-detail" data-value="太少">想多一些選擇</button><button class="btn quiet" data-action="close-modal">稍後再說</button></div>`);else toast('謝謝，收到你的回饋。')}else if(a==='feedback-detail'){state.feedback=b.dataset.value;save();closeModal();toast('回饋已保留，謝謝！')}else if(a==='shared-link'){const m=state.messages.find(m=>m.id===b.dataset.message);if(m)showModal(`${modalHead(esc(m.linkTitle))}<div class="place-source">${esc(m.url||m.text)}</div><button class="btn wide" data-action="close-modal">關閉</button>`)}
});
document.addEventListener('click',e=>{if(!e.target.closest('.popover,.tools'))closePopover()});
$('composer').addEventListener('submit',e=>{e.preventDefault();send($('messageinput').value)});
$('messageinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(e.target.value)}});
$('messageinput').addEventListener('input',e=>{e.target.style.height='';e.target.style.height=Math.min(130,e.target.scrollHeight)+'px'});
$('searchinput').addEventListener('input',applySearch);
document.addEventListener('submit',e=>{if(e.target.id==='scopeform'){e.preventDefault();activate(new FormData(e.target).get('scope'))}else if(e.target.id==='linkform'){e.preventDefault();const data=new FormData(e.target),url=String(data.get('url')),title=String(data.get('title'));let domain;try{domain=new URL(url).hostname}catch{return}closeModal();const known=extractPlaces(title)[0];addMessage({type:'link',who:'Mia',text:'這個也先存著。',url,linkTitle:title,domain,place:known});if(state.active){collect(title);if(!known){const id='custom'+Date.now();state.places[id]={name:title,area:'分享連結',source:'Mia · '+now(),quote:url,alias:[title]};state.available.push(id)}save();say('這筆分享已放進候選清單，原始連結也一起保留。')}}else if(e.target.id==='placeform'){e.preventDefault();const name=String(new FormData(e.target).get('name')).trim();if(!name)return;const id=Object.keys(state.places).find(k=>state.places[k].name===name)||'custom'+Date.now();if(!state.places[id])state.places[id]={name,area:'手動加入',source:'Mia · '+now(),quote:'這個地點由 Mia 手動加入。',alias:[name]};if(!state.available.includes(id))state.available.push(id);save();closeModal();renderDrawer();toast('已加入候選清單。')}});
document.addEventListener('change',e=>{if(e.target.matches('[data-time]')){if(!e.target.value)return;editPlan.days[selectedDay].items[Number(e.target.dataset.time)].time=e.target.value;dirty=true;renderDrawer()}});
let dragged=null;document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-stop]');if(!el)return;dragged=Number(el.dataset.stop);el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragged))});document.addEventListener('dragover',e=>{if(e.target.closest('[data-stop]'))e.preventDefault()});document.addEventListener('drop',e=>{const el=e.target.closest('[data-stop]');if(!el||dragged===null)return;e.preventDefault();const to=Number(el.dataset.stop),items=editPlan.days[selectedDay].items;const item=items.splice(dragged,1)[0];items.splice(to,0,item);dragged=null;editChanged()});document.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.dragging').forEach(e=>e.classList.remove('dragging'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modalroot').innerHTML){closeModal();e.preventDefault()}else if($('popover').innerHTML){closePopover();e.preventDefault()}else if(drawer){closeDrawer();e.preventDefault()}}if(e.key==='Tab'&&$('modalroot').innerHTML){const els=[...$('modalroot').querySelectorAll('button:not(:disabled),input,textarea')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let resultsOpen=false,resultKind='全部',resultQuery='';
function getSources(id){const p=place(id);const sources=p.sources?.length?clone(p.sources):[{source:p.source,quote:p.quote,ref:p.ref}];if(state.scope==='all'&&id==='kuromon'&&!sources.some(x=>x.ref==='seed-mia'))sources.push({source:'Mia · 今天',quote:'我也存了同一家！第三天想逛中崎町的咖啡廳，晚上再去梅田。',ref:'seed-mia'});return sources}
function ensureResults(){if(!state.results)state.results={updated:now(),preferences:{Alex:'交通不要太趕，住宿以難波為主。',Mia:'第三天想逛咖啡廳。',Ben:'環球影城留一整天。',Yuki:'尚未提出確定偏好。'},unresolved:state.scope==='all'?[{id:'riverside',name:'河邊咖啡廳',source:'Yuki · 先前的分享',quote:'這家河邊咖啡廳好漂亮，先存著！',note:'影片裡沒有明確店名，暫不排進行程。',status:'pending'}]:[]};return state.results}
function resultCounts(){const r=ensureResults();return {places:state.available.length,merged:state.available.reduce((n,id)=>n+Math.max(0,getSources(id).length-1),0),pending:r.unresolved.filter(x=>x.status==='pending').length}}
function organizedCard(){const c=resultCounts();return `<div class="organized-card"><div class="organized-top"><div class="organized-symbol">${icon('Bookmark')}</div><div><span class="eyebrow">整理成果</span><h3>大阪的旅行靈感，收好了。</h3></div></div><div class="organized-stats"><div><strong>${c.places}</strong><span>個候選地點</span></div><div><strong>${c.merged}</strong><span>筆重複合併</span></div><div><strong>${c.pending}</strong><span>筆待補資訊</span></div></div><p>11/20–22 · 4 人 · 住難波<br>原始分享、大家的想法都一起保留。</p><button class="btn primary wide" data-action="open-results">查看整理成果 ${icon('ArrowUpRight')}</button></div>`}
function publishResults(){ensureResults();addMessage({type:'organized',who:'Waymark',text:'先把散在聊天裡的地點和想法收在一起，重複分享也合併好了。'});save()}
function openResults(){closePopover();if(!state.plan){callBot();return}if(drawer&&dirty){toast('先分享或保留行程裡的修改，再查看整理成果。');return}drawer=null;$('drawerroot').innerHTML='';ensureResults();resultsOpen=true;resultKind='全部';resultQuery='';renderResults()}
function closeResults(){resultsOpen=false;$('resultsroot').innerHTML=''}
function scheduledDay(id){return state.plan?.days.findIndex(d=>d.items.some(x=>x.place===id))??-1}
function resultPlacesHTML(){const ids=state.available.filter(id=>(resultKind==='全部'||place(id).kind===resultKind)&&(!resultQuery||(place(id).name+' '+place(id).area).toLowerCase().includes(resultQuery.toLowerCase())));return ids.length?ids.map(id=>{const p=place(id),day=scheduledDay(id),src=getSources(id);return `<article class="result-place"><div class="result-place-top"><span class="category">${esc(p.kind||'地點')}</span>${src.length>1?`<span class="merged-tag">${src.length} 則分享已合併</span>`:''}</div><h3>${esc(p.name)}</h3><p>${esc(p.area||'手動加入')}</p><div class="place-sharers">${[...new Set(src.map(x=>x.source?.split(' · ')[0]).filter(Boolean))].slice(0,3).map(name=>avatar(name)).join('')}<span>${src.length} 則原始來源</span></div><footer><button class="text-action" data-action="source" data-place="${esc(id)}">查看來源 ${icon('ChevronRight')}</button><button class="place-plan" data-action="result-plan-place" data-place="${esc(id)}">${day>=0?'第 '+(day+1)+' 天 · 調整':'加入行程'}${icon(day>=0?'Check':'Plus')}</button></footer></article>`}).join(''):'<div class="result-empty">沒有符合的地點，試試其他分類或名稱。</div>'}
function renderResults(){if(!resultsOpen)return;const r=ensureResults(),c=resultCounts();$('resultsroot').innerHTML=`<section class="results-screen" aria-label="大阪旅行整理成果"><header class="results-toolbar"><div class="text-action results-title">${icon('Bookmark')}整理成果</div><span>${state.active?'持續整理中':'已保存的整理成果'}</span><button class="btn" data-action="open-trip">${icon('Route')}查看行程</button><button class="iconbtn small" data-action="close-results" aria-label="收起整理成果">${icon('X')}</button></header><div class="results-scroll"><div class="results-inner"><div class="results-heading"><div><div class="eyebrow">OSAKA / OUR COLLECTION</div><h2>大阪的靈感，都在這裡。</h2><p>不用翻聊天，也不用再傳一次。</p></div><span class="results-state"><span class="dot"></span>${state.active?'已更新 '+r.updated:'本次整理已結束'}</span></div><div class="result-facts"><span>${icon('CalendarDays')}11/20–22 · 三天</span><span>${icon('Users')}4 人同行</span><span>${icon('MapPin')}住難波</span><span>${state.scope==='all'?'既有與後續對話':'從 '+state.startedAt+' 開始的對話'}</span></div><div class="result-stat-row"><div><strong>${c.places}<small>個</small></strong><span>候選地點</span></div><div><strong>${c.merged}<small>筆</small></strong><span>重複分享已合併</span></div><div><strong>${c.pending}<small>筆</small></strong><span>待補資訊</span></div></div><section class="result-section"><div class="result-section-title"><h3>大家的想法</h3><button class="text-action" data-action="edit-preferences">${icon('SquarePen')}補充我的想法</button></div><div class="preferences-grid">${Object.entries(r.preferences).map(([name,text])=>`<div class="preference-row">${avatar(name)}<div><strong>${esc(name)}</strong><p>${esc(text)}</p></div></div>`).join('')}</div></section><section class="result-section"><div class="result-section-title"><div><h3>一起分享過的地方</h3><p>分享先收為候選，排進行程後仍然可以修改。</p></div><label class="result-search">${icon('Search')}<input id="resultquery" aria-label="搜尋整理出的地點" placeholder="找地點" value="${esc(resultQuery)}"></label></div><div class="result-filters">${['全部',...[...new Set(state.available.map(id=>place(id).kind||'地點'))]].map(kind=>`<button class="${resultKind===kind?'selected':''}" data-action="result-filter" data-kind="${esc(kind)}">${esc(kind)}</button>`).join('')}</div><div class="result-place-grid" id="resultplaces">${resultPlacesHTML()}</div></section>${r.unresolved.length?`<section class="result-section"><div class="result-section-title"><h3>${c.pending?'還有一點不確定':'已釐清的分享'}</h3><span class="section-note">原始分享都有保留</span></div>${r.unresolved.map(item=>`<article class="uncertain-card ${item.status!=='pending'?'resolved':''}"><div class="uncertain-icon">${icon(item.status==='pending'?'CircleHelp':'Check')}</div><div><strong>${esc(item.resolvedName||item.name)}</strong><p>${esc(item.status==='pending'?item.note:item.status==='excluded'?'已補充位置，這次先不排。':'已補充地點，放進候選清單。')}</p><small>${esc(item.source)} · 「${esc(item.quote)}」</small></div>${item.status==='pending'?`<button class="btn" data-action="resolve-place" data-id="${esc(item.id)}">補上地點</button>`:`<span class="tag">${item.status==='excluded'?'本次不排':'已補充'}</span>`}</article>`).join('')}</section>`:''}<section class="result-plan-preview"><div><div class="eyebrow">YOUR ITINERARY / v${state.plan.version}</div><h3>把靈感，排成這趟旅行。</h3><p>三天草稿已依目前的想法排好，隨時可以一起改。</p></div><div class="result-plan-days">${state.plan.days.map((day,i)=>`<button data-action="result-open-day" data-day="${i}"><small>DAY ${i+1} · ${esc(day.date)}</small><strong>${esc(names(day.items))}</strong>${icon('ChevronRight')}</button>`).join('')}</div><button class="btn primary wide" data-action="open-trip">打開行程，接著規劃 ${icon('ArrowUpRight')}</button></section></div></div></section>`}
function resolvePlaceModal(id){const item=ensureResults().unresolved.find(x=>x.id===id);if(!item)return;showModal(`${modalHead('這個地方在哪裡？')}<p>補上店名或地點就好，不需要重新整理整段聊天。</p><div class="place-source"><strong>${esc(item.source)}</strong>${esc(item.quote)}</div><form id="resolveform"><input type="hidden" name="id" value="${esc(id)}"><label class="field">店名或地點<input name="name" required maxlength="80" placeholder="例如：京都・鴨川河畔咖啡廳"></label><label class="scope-choice"><input type="radio" name="decision" value="include"><span><strong>加入這次候選</strong><small>保留來源，之後再決定排在哪天。</small></span></label><label class="scope-choice"><input type="radio" name="decision" value="exclude" checked><span><strong>這次先不排</strong><small>記住補充內容，避免下次再問。</small></span></label><div class="modal-footer"><button class="btn primary wide" type="submit">保留這次補充</button></div></form>`)}
function saveResolution(id,name,decision){name=String(name).trim();if(!name)return;const r=ensureResults(),item=r.unresolved.find(x=>x.id===id);if(!item)return;item.resolvedName=name;item.status=decision==='include'?'resolved':'excluded';if(decision==='include'){const key='resolved-'+id;state.places[key]={name,kind:'地點',area:'已補充的分享',source:item.source,quote:item.quote,alias:[name]};if(!state.available.includes(key))state.available.push(key)}r.updated=now();save();closeModal();renderResults();renderMessages();say(decision==='include'?'地點補好了，已放進候選，原始分享也留著。':'收到，已記下「'+name+'」，這次先不排，不用再重複說明。');renderHeader();toast('補充已保留。')}
function editPreferences(){showModal(`${modalHead('補充你的旅行想法')}<p>會和這次整理一起保留，方便大家接著規劃。</p><form id="preferenceform"><label class="field">Mia 的想法<input name="note" maxlength="150" required value="${esc(ensureResults().preferences.Mia)}"></label><div class="modal-footer"><button class="btn primary wide" type="submit">更新我的想法</button></div></form>`)}
function resultPlanPlace(id){const day=scheduledDay(id);if(day>=0){openTrip();selectedDay=day;renderDrawer();return}showModal(`${modalHead('把'+esc(place(id).name)+'排在哪天？')}<p>先選一天，之後仍可調整時間與順序。</p>${state.plan.days.map((d,i)=>`<button class="btn wide" style="margin-top:10px" data-action="result-add-day" data-place="${esc(id)}" data-day="${i}">第 ${i+1} 天 · ${esc(d.date)} · ${esc(d.title)}</button>`).join('')}`)}
function bootResults(){if(!state.plan){state=initial();state.active=true;state.scope='all';state.startedAt='14:00';state.available=Object.keys(INITIAL_PLACES);state.messages.push({id:'results-call',type:'text',who:'Mia',text:'@Waymark 幫我們整理大阪的討論。',time:'14:00'});state.plan=makePlan();ensureResults();state.messages.push({id:'results-scope',type:'system',text:'Waymark 已啟用 · 既有與後續對話',time:'14:00'},{id:'results-processed',type:'processing',who:'Waymark',text:'這次的對話已整理完成',scopeText:'既有與後續對話',status:'done',time:'14:02'});publishResults();botCard(state.plan,'依三天、四人和大家的想法，先排好這一版。');save()}else ensureResults();renderMessages();renderHeader();openResults()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='open-results')openResults();else if(a==='close-results')closeResults();else if(a==='result-filter'){resultKind=b.dataset.kind;const top=$('resultsroot').querySelector('.results-scroll')?.scrollTop||0;renderResults();const scroll=$('resultsroot').querySelector('.results-scroll');if(scroll)scroll.scrollTop=top}else if(a==='resolve-place')resolvePlaceModal(b.dataset.id);else if(a==='edit-preferences')editPreferences();else if(a==='result-plan-place')resultPlanPlace(b.dataset.place);else if(a==='result-open-day'){openTrip();selectedDay=Number(b.dataset.day);renderDrawer()}else if(a==='result-add-day'){const p=clone(state.plan),i=Number(b.dataset.day),id=b.dataset.place;if(!p.days[i].items.some(x=>x.place===id))p.days[i].items.push({place:id,time:'14:00'});closeModal();commitPlan(p,'已把'+place(id).name+'加入第 '+(i+1)+' 天。');renderResults();toast('已加入行程。')}});
document.addEventListener('input',e=>{if(e.target.id==='resultquery'){resultQuery=e.target.value;$('resultplaces').innerHTML=resultPlacesHTML()}});
document.addEventListener('submit',e=>{if(e.target.id==='resolveform'){e.preventDefault();const f=new FormData(e.target);saveResolution(String(f.get('id')),String(f.get('name')).trim(),String(f.get('decision')))}else if(e.target.id==='preferenceform'){e.preventDefault();const note=String(new FormData(e.target).get('note')).trim();if(!note)return;const r=ensureResults();r.preferences.Mia=note;r.updated=now();save();closeModal();renderResults();toast('你的想法已更新。')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.defaultPrevented&&!$('modalroot').innerHTML&&!drawer&&resultsOpen)closeResults()});

hydrate();renderMessages();renderHeader();$('timeline').scrollTop=$('timeline').scrollHeight;
if(BOOT_VIEW==='results')bootResults();
</script></body></html>
